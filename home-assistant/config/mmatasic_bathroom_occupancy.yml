# Inside config/packages/bathroom_occupancy.yaml

input_number:
  bathroom_last_brightness:
    name: "Bathroom Last Brightness"
    min: 0
    max: 100
    step: 1
    icon: mdi:brightness-6

automation:
  - alias: "Bathroom: Memory for SOMRIG"
    description: "Saves manual brightness adjustments to the helper."
    trigger:
      - platform: state
        entity_id: light.bathroom_silverglans
        attribute: brightness
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.context.parent_id is none }}"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.bathroom_last_brightness
        data:
          value: "{{ (trigger.to_state.attributes.brightness / 255 * 100) | round(0) }}"
    mode: restart

  - alias: "Bathroom: Occupancy with Night Mode"
    description: "Occupancy control with separate transitions and night window."
    mode: restart
    variables:
      light_entity: light.bathroom_silverglans
      night_brightness: 10
      off_delay: 120
      transition_on: 2
      transition_off: 10
    trigger:
      - platform: state
        entity_id: binary_sensor.myggspray_occupancy
        from: "off"
        to: "on"
        id: "on_path"
      - platform: state
        entity_id: binary_sensor.myggspray_occupancy
        from: "on"
        to: "off"
        id: "off_path"
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: "on_path"
            sequence:
              - service: light.turn_on
                target:
                  entity_id: "{{ light_entity }}"
                data:
                  transition: "{{ transition_on }}"
                  brightness_pct: >
                    {% set hr = now().hour %}
                    {% set min = now().minute %}
                    {% if (hr == 23 and min >= 59) or (hr < 6) or (hr == 6 and min < 30) %}
                      {{ night_brightness }}
                    {% else %}
                      {{ states('input_number.bathroom_last_brightness') | int(50) }}
                    {% endif %}
          - conditions:
              - condition: trigger
                id: "off_path"
            sequence:
              - delay: "{{ off_delay }}"
              - service: light.turn_off
                target:
                  entity_id: "{{ light_entity }}"
                data:
                  transition: "{{ transition_off }}"
