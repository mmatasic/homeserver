- id: water_leak_detection
  alias: Water leak detected
  description: Alert on any water leak sensor (Aqara sudoper + Badring) - push, TTS,
    red flash
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.aqara_sudoper_water_leak
    - binary_sensor.badring_detektor_vode_1_water_leak
    from: 'off'
    to: 'on'
  variables:
    leak_where: "{% set m = {\n  'binary_sensor.aqara_sudoper_water_leak': 'kitchen
      sink (Sudoper)',\n  'binary_sensor.badring_detektor_vode_1_water_leak': 'Badring
      water detector'\n} %} {{ m.get(trigger.entity_id, trigger.to_state.name) }}\n"
  actions:
  - action: persistent_notification.create
    data:
      title: "\U0001F6A8 Water leak detected"
      message: Leak detected at {{ leak_where }} at {{ now().strftime('%H:%M:%S %d.%m.%Y')
        }}. Check immediately!
  - action: notify.mobile_app_samsung_s23
    data:
      title: "\U0001F6A8 WATER LEAK \U0001F6A8"
      message: Leak detected at {{ leak_where }} - check immediately!
      data:
        priority: high
        ttl: 0
        sticky: true
        tag: water_leak
  - action: tts.speak
    continue_on_error: true
    metadata: {}
    data:
      cache: false
      media_player_entity_id: media_player.wiim_amp
      message: Warning. Water leak detected at {{ leak_where }}. Please check immediately.
    target:
      entity_id: tts.google_translate_en_com
  - action: light.turn_on
    continue_on_error: true
    data:
      flash: short
      rgb_color:
      - 255
      - 0
      - 0
      brightness_pct: 100
    target:
      device_id: 7e1a075569c9ec2898b2a8b4cc478f6c
  mode: queued
