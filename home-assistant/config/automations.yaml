- alias: 'Bathroom: Memory for SOMRIG'
  id: bathroom_memory_somrig
  trigger:
  - platform: state
    entity_id: light.silverglans_kupaona
    attribute: brightness
  condition:
  - condition: template
    value_template: '{{ trigger.to_state.context.parent_id is none }}'
  - condition: template
    value_template: '{{ trigger.to_state.state == ''on'' and trigger.to_state.attributes.brightness
      is not none }}'
  action:
  - service: input_number.set_value
    target:
      entity_id: input_number.bathroom_last_brightness
    data:
      value: '{{ (trigger.to_state.attributes.brightness / 255 * 100) | round(0) }}'
- alias: 'Bathroom: Occupancy Control'
  id: bathroom_occupancy_control
  mode: restart
  variables:
    light_entity: light.silverglans_kupaona
    night_brightness: 10
    off_delay: 900
    transition_on: 1
    transition_off: 5
  trigger:
  - platform: state
    entity_id: binary_sensor.myggspray_wrlss_mtn_sensor_occupancy
    from: 'off'
    to: 'on'
    id: motion_on
  - platform: state
    entity_id: binary_sensor.myggspray_wrlss_mtn_sensor_occupancy
    from: 'on'
    to: 'off'
    id: motion_off
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: motion_on
      sequence:
      - service: light.turn_on
        target:
          entity_id: '{{ light_entity }}'
        data:
          transition: '{{ transition_on }}'
          brightness_pct: "{% set hr = now().hour %} {% set min = now().minute %}
            {# Night Logic: 23:59 to 06:30 #} {% if (hr == 23 and min >= 59) or (hr
            < 6) or (hr == 6 and min < 30) %}\n  {{ night_brightness }}\n{% else %}\n
            \ {# Use saved SOMRIG brightness #}\n  {{ states('input_number.bathroom_last_brightness')
            | int(50) }}\n{% endif %}\n"
    - conditions:
      - condition: trigger
        id: motion_off
      sequence:
      - delay: '{{ off_delay }}'
      - service: light.turn_off
        target:
          entity_id: '{{ light_entity }}'
        data:
          transition: '{{ transition_off }}'
- id: battery_notes_low_push
  alias: 'Battery Notes: low battery phone push'
  description: Push to phone when any Battery Notes device crosses its low threshold
  triggers:
  - trigger: event
    event_type: battery_notes_battery_threshold
    event_data:
      battery_low: true
  actions:
  - action: notify.mobile_app_samsung_s23
    data:
      title: "\U0001F50B Low battery: {{ trigger.event.data.device_name }}"
      message: '{{ trigger.event.data.device_name }} is at {{ trigger.event.data.battery_level
        }}% - needs {{ trigger.event.data.battery_quantity }}x {{ trigger.event.data.battery_type
        }}.'
      data:
        tag: bn_battery_{{ trigger.event.data.device_id }}
  mode: queued
